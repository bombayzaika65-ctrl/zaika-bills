<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A11D21">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Bombay Zaika Billing</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1b2230;--mu:#6b7280;--bd:#e3ddd2;--ac:#A11D21;--gold:#B8892B;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110f;--card:#211b19;--tx:#f1ebe4;--mu:#a69d94;--bd:#3a302c;--ac:#ec6a6e;--gold:#e0b04a;--inp:#2a2220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110f;--card:#211b19;--tx:#f1ebe4;--mu:#a69d94;--bd:#3a302c;--ac:#ec6a6e;--gold:#e0b04a;--inp:#2a2220;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid #A11D21;background:var(--card)}
.hd img{height:50px;background:#fff;border-radius:8px;padding:2px;clip-path:inset(0 0 7% 0)}
.hd div{flex:1;line-height:1.2}.hd small{display:block;color:var(--gold)}
button,input,select,textarea{font:inherit;color:var(--tx)}
.hd button{background:none;border:1px solid var(--bd);border-radius:10px;font-size:20px;padding:6px 10px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:10px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>.s{flex:0 0 auto}
.b{background:#A11D21;color:#fff;border:0;border-radius:12px;padding:12px 14px;font-weight:600;width:100%}
.g{background:var(--card);border:1px solid var(--ac);color:var(--ac);border-radius:12px;padding:11px 14px;font-weight:600}
.gd{background:var(--gold);color:#222;border:0;border-radius:12px;padding:12px 14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--inp);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-weight:600;text-align:left}
.chip small{display:block;color:var(--mu);font-weight:400}
.ir,.mr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ir .in{flex:1;min-width:0}.ir input,.mr .p{width:90px;flex:none}.ir .q{width:58px}.mr input:first-child{flex:1}
.x{background:none;border:0;color:var(--ac);font-size:24px;padding:0 8px}
.tr{display:flex;justify-content:space-between;padding:5px 0}.tr.t{font-weight:700;font-size:20px;border-top:2px solid var(--ac);margin-top:4px;padding-top:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.row .gr{flex:1;min-width:0}.row small{display:block;color:var(--mu)}.rt{text-align:right}.no{color:var(--ac);font-weight:700}
.due{color:var(--ac)!important;font-weight:600}.ok{color:#2e8b57!important}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mu)}nav button b{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:700}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 30px}
#ov img{width:100%;max-width:640px;display:block;margin:10px auto;border:1px solid var(--bd);background:#fff}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:auto}
#r2,#r3{margin-top:8px}#r3[hidden]{display:none}
#sr{display:flex;justify-content:center;align-items:center;gap:6px;margin:6px auto 0;max-width:640px;color:var(--mu)}
#sr button{background:none;border:0;padding:8px 10px;font-size:14px;color:var(--mu)}#sr #bd{color:#c0392b}#sr button[hidden],#sr span[hidden]{display:none}
#sg{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.3);max-height:230px;overflow:auto}#sg div{padding:12px;border-bottom:1px solid var(--bd)}
.dot b::after{content:'';display:inline-block;width:10px;height:10px;background:#e53935;border-radius:50%;margin-left:2px;vertical-align:top}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;color:#fff}.tag.pk{background:#2e7d5b}.tag.dl{background:#A11D21}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:14px}
@media print{@page{size:A4;margin:0}body>*:not(#ov){display:none!important}#ov{position:static;padding:0}#ov>*:not(img){display:none!important}#ov img{border:0;margin:0;max-width:none;width:100%}}
</style></head><body>
<div id="app">
<div class="hd"><img id="lg" alt=""><div><b>Bombay Zaika</b><small>Bill &amp; invoice</small></div><button id="th">◐</button></div>
<main>
<section id="t0">
<div class="card"><label>Customer name</label><div style="position:relative"><input id="cn" autocomplete="off"><div id="sg" hidden></div></div>
<div class="r"><div><label>Date (delivery day)</label><input id="cd" type="date"></div><div><label>WhatsApp (with country code)</label><input id="cp" type="tel" placeholder="+98…"></div></div><label>Order type</label><select id="ot"><option value="d">Delivery</option><option value="p">Pick-up</option></select></div>
<div class="card"><h3>Menu</h3><div class="chips" id="mb"></div></div>
<div class="card"><h3>Items</h3><div id="il"></div>
<label>Custom item</label><div class="r"><input id="cin" placeholder="Name" style="flex:2"><input id="ciq" inputmode="numeric" placeholder="Qty" style="max-width:64px"><input id="cip" inputmode="numeric" placeholder="Price"><button class="gd s" id="ca">Add</button></div></div>
<div class="card"><label>Discount</label><div class="r"><select id="dt" class="s" style="width:110px"><option value="t">Toman</option><option value="p">%</option></select><input id="dv" inputmode="numeric" placeholder="0"></div>
<div id="dbox"><label>Delivery charge</label><input id="dl" inputmode="numeric" placeholder="0"><label>Delivered by (gets the delivery charge; not on invoice)</label><select id="dm"></select></div>
<label>Received</label><input id="rc" inputmode="numeric" placeholder="0"><label style="display:flex;align-items:center;gap:10px;font-size:17px;color:var(--tx);margin-top:10px"><input type="checkbox" id="pf" style="width:26px;height:26px;flex:none"> Paid in full</label></div>
<div class="card" id="tot"></div>
<button class="g" id="so" style="width:100%;margin-bottom:8px">Save as order (deliver later)</button><button class="b" id="pv">Preview invoice</button><button class="g" id="nb" style="width:100%;margin-top:8px">Clear / start a new bill</button>
</section>
<section id="t1" hidden><div class="card"><select id="sp" style="margin-bottom:8px"><option value="d">Sales: Today</option><option value="m" selected>Sales: This month</option><option value="a">Sales: All time</option></select><div id="sm"></div></div><input id="hs" placeholder="Search customer or invoice no." style="margin-bottom:10px"><div id="hl"></div></section>
<section id="t2" hidden><div class="card" id="ct"></div><input id="cs" placeholder="Search customer or phone" style="margin-bottom:10px"><div id="cl2"></div></section>
<section id="t3" hidden>
<div class="card"><h3>Menu items</h3><div id="ml"></div>
<div class="r" style="margin-top:8px"><input id="mnn" placeholder="New item"><input id="mnp" class="s" style="width:100px" inputmode="numeric" placeholder="Price"><button class="gd s" id="ma">Add</button></div>
<small style="color:var(--mu)">Changing a price never changes saved bills.</small></div>
<div class="card"><h3>Backup</h3><div id="bkb" hidden style="border:1px solid var(--ac);border-radius:10px;padding:10px;margin-bottom:10px"></div><button class="g" id="bc" style="width:100%">Copy all data as text</button>
<textarea id="bk" rows="3" readonly style="margin-top:8px" placeholder="Backup text appears here"></textarea>
<label>Paste a backup to restore</label><textarea id="br" rows="3"></textarea>
<button class="b" id="brs" style="margin-top:8px">Restore backup</button></div>
</section>
<section id="t4" hidden><div id="ol"></div></section>
<section id="t5" hidden><div class="card"><label style="margin-top:0">Deliveries on</label><input type="date" id="dday"><div id="dres" style="margin-top:8px"></div></div><div class="card" id="dtot"></div><div id="dli"></div><div class="card"><label>Add delivery man</label><div class="r"><input id="dn" placeholder="Name"><button class="gd s" id="da">Add</button></div></div></section>
<div id="ver" style="text-align:center;color:var(--mu);font-size:12px;padding:6px 0 2px">Version 13 · tap to check for update</div>
</main>
<nav id="nv"><button class="on"><b>🧾</b>New bill</button><button><b>📜</b>History</button><button><b>👥</b>Customers</button><button><b>🍽</b>Menu</button><button><b>📦</b>Orders</button><button><b>🛵</b>Delivery</button></nav>
</div>
<div id="ov" hidden>
<div class="bt" style="margin-bottom:6px"><button class="g" id="oc">← Close</button><button class="gd" id="bs">Share image</button></div>
<img id="pimg" alt="Invoice">
<div class="bt" id="r2"><button class="g" id="bw">WhatsApp text</button><button class="g" id="bpd">📄 Share PDF</button></div>
<div class="bt" id="r3"><button class="b" id="bsv">Save bill</button><button class="gd" id="bnw">New bill</button></div>
<div id="hp" class="card" style="max-width:640px;margin:12px auto">
<div id="bal" style="font-size:18px;font-weight:700;margin-bottom:4px"></div>
<label>Add payment (Toman)</label><div class="r"><input id="pa" inputmode="numeric"><button class="gd s" id="pb">Add</button></div>
<label style="display:flex;align-items:center;gap:10px;font-size:17px;color:var(--tx);margin-top:12px"><input type="checkbox" id="pfh" style="width:26px;height:26px;flex:none"> Paid in full</label></div>
<div id="sr"><button id="be" title="Edit items, customer, delivery, driver or received amount">✎ Edit</button><span>·</span><button id="bp">🖨 Print</button><span>·</span><button id="bd">🗑 Delete</button></div>
</div>
<div id="ts" hidden></div>

async function pdfBlob(cv){

const add=u=>{parts.push(u);len+=u.length},S=t=>add(te.encode(t)),o=(n,fn)=>{off[n]=len;S(n+' 0 obj\n');fn();S('endobj\n')};
S('%PDF-1.4\n');
o(1,()=>S('<</Type/Catalog/Pages 2 0 R>>\n'));
o(2,()=>S('<</Type/Pages/Kids[3 0 R]/Count 1>>\n'));
o(3,()=>S('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+PH.toFixed(2)+']/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>\n'));
o(4,()=>{S('<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jd.length+'>>\nstream\n');add(jd);S('\nendstream\n')});
const cs='q '+W+' 0 0 '+ih.toFixed(2)+' 0 '+(PH-ih).toFixed(2)+' cm /I Do Q';
o(5,()=>S('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\n'));
const xr=len;S('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)S(String(off[i]).padStart(10,'0')+' 00000 n \n');
S('trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
